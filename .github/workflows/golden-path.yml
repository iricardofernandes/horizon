name: golden path

# This is intentionally not path-filtered. Phase 8's highest-priority contract is that
# the business flow remains green after every push, including repository-wide changes.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: golden-path-${{ github.ref }}
  cancel-in-progress: true

jobs:
  demo:
    name: seed and order choreography
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            contracts/package-lock.json
            identity/package-lock.json
            catalog/package-lock.json
            inventory/package-lock.json
            sales/package-lock.json
            webhooks/package-lock.json
            parties/package-lock.json
            financial/package-lock.json
            treasury/package-lock.json
            web/package-lock.json

      - name: start the platform
        run: make up

      - name: publish contracts to the local registry
        run: |
          cd contracts
          npm ci --no-audit --no-fund
          cd ..
          make publish-contracts

      - name: install golden-path modules
        run: |
          for module in identity catalog inventory sales webhooks parties financial treasury; do
            npm ci --prefix "$module" --no-audit --no-fund
          done

      - name: run golden path twice
        run: |
          make demo
          make demo

      - name: install and run the browser golden path
        run: |
          npm ci --prefix web --no-audit --no-fund
          cd web
          npx --no-install playwright-core install --with-deps chromium
          cd ..
          make up-apps
          make test-phase10

      - name: diagnostics on failure
        if: failure()
        run: |
          docker compose -f infra/docker-compose.yml --env-file infra/.env ps
          for service in postgres rabbitmq otel-collector jaeger kong identity catalog inventory sales webhooks parties financial treasury web; do
            echo "::group::$service"
            docker logs "horizon-$service" 2>&1 | tail -100 || true
            echo "::endgroup::"
          done

      - name: tear down
        if: always()
        run: make clean
