name: repo

# Checks that belong to the repository as a whole rather than to any one project.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: repo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boundaries:
    name: module boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/check-boundaries.mjs

  commit-messages:
    name: conventional commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: install commitlint
        run: npm install --no-save @commitlint/cli@21 @commitlint/config-conventional@21
      # A squash merge takes its message from the PR title, so the title is linted too.
      - name: lint pull request title
        run: echo "${{ github.event.pull_request.title }}" | npx commitlint
      - name: lint commits in range
        run: npx commitlint --from origin/${{ github.base_ref }} --to HEAD

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Key material must never reach the repository (ADR 0018).
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source=/repo --redact --verbose --exit-code 1

  gateway:
    name: kong configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: install deck
        run: |
          TAG=$(curl -fsSL https://api.github.com/repos/Kong/deck/releases/latest \
            | grep -oP '"tag_name":\s*"\K[^"]+')
          curl -fsSL "https://github.com/Kong/deck/releases/download/${TAG}/deck_${TAG#v}_linux_amd64.tar.gz" \
            | tar -xz -C /tmp deck
          sudo mv /tmp/deck /usr/local/bin/
          deck version
      - name: validate kong.yml
        run: deck file validate gateway/kong.yml

  terraform:
    name: terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: fmt
        run: |
          if [ -n "$(find infra/terraform -name '*.tf' -print -quit)" ]; then
            terraform -chdir=infra/terraform fmt -check -recursive
          else
            echo "no terraform yet — phase 13"
          fi

      # Terraform is written and never applied (ADR 0034). This asserts it stays that
      # way. The check lives in a script because an inline grep matches its own error
      # message — which is exactly how the first version of it failed.
      - name: assert no workflow can apply terraform
        run: node scripts/assert-no-terraform-apply.mjs

  contracts:
    name: contract compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: contracts/package-lock.json

      - name: install and build contracts
        working-directory: contracts
        run: |
          npm ci --no-audit --no-fund
          npm run build

      # The gate is what turns the versioning policy into a guarantee, so it is itself
      # tested. node:test, because the repository root has no dependencies by design.
      - name: test the compatibility analysis
        run: node --test 'scripts/**/*.test.mjs'

      # Fails a breaking change to a published schema that is not accompanied by the
      # right version bump (ADR 0030).
      - name: compatibility gate
        run: node scripts/check-contract-compat.mjs

      # docs/events.md is generated. A hand-edit, or a schema change without a
      # regeneration, leaves the catalogue lying to its readers.
      - name: docs/events.md is up to date
        run: |
          cd contracts && npm run docs:events >/dev/null && cd ..
          if ! git diff --quiet -- docs/events.md; then
            echo "::error::docs/events.md is stale — run 'npm run docs:events' in contracts/"
            git diff -- docs/events.md
            exit 1
          fi
          echo "docs/events.md matches the schemas"

      # The snapshot is the compatibility baseline. If it does not match the current
      # schemas at the current version, the last release was published without it.
      - name: published-schemas.json is up to date
        run: |
          cd contracts && npm run schemas:snapshot >/dev/null && cd ..
          if ! git diff --quiet -- contracts/published-schemas.json; then
            echo "::error::contracts/published-schemas.json is stale — run 'npm run release:prepare'"
            git diff --stat -- contracts/published-schemas.json
            exit 1
          fi
          echo "published-schemas.json matches the schemas"

  workflows:
    name: action references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # A bad `uses:` ref fails a job during set-up, before any `if` runs, and the error
      # names the action rather than the typo. Cheaper to catch here.
      - run: node scripts/check-action-refs.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docs:
    name: documentation links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: check relative links resolve
        run: node scripts/check-doc-links.mjs
