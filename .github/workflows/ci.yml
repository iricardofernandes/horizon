name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Path-filtered: a change in one project does not rebuild the others (ADR 0001).
  matrix:
    name: select affected projects
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.select.outputs.projects }}
      any: ${{ steps.select.outputs.any }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - id: select
        run: |
          BASE=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          fi
          MATRIX=$(node scripts/ci-matrix.mjs "$BASE")
          echo "projects=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "any=$(echo "$MATRIX" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).include.length>0))')" >> "$GITHUB_OUTPUT"
          echo "$MATRIX"

  project:
    name: ${{ matrix.name }}
    needs: matrix
    if: needs.matrix.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.projects) }}
    defaults:
      run:
        working-directory: ${{ matrix.path }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.path }}/package-lock.json

      - name: install
        run: npm ci --no-audit --no-fund

      - name: typecheck
        run: npm run typecheck --if-present

      - name: lint
        run: npm run lint --if-present

      - name: unit tests
        run: npm test --if-present

      - name: build
        run: npm run build --if-present

      - name: audit
        run: npm audit --audit-level=high || true

  e2e:
    name: e2e ${{ matrix.name }}
    needs: matrix
    if: needs.matrix.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.projects) }}
    defaults:
      run:
        working-directory: ${{ matrix.path }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.path }}/package-lock.json

      - name: install
        run: npm ci --no-audit --no-fund

      # Testcontainers starts its own PostgreSQL, Redis and RabbitMQ, so no service
      # containers are declared here — the suite is hermetic (ADR 0013).
      - name: integration and e2e tests
        if: matrix.kind == 'service'
        run: npm run test:e2e --if-present

  docker:
    name: image ${{ matrix.name }}
    needs: matrix
    if: needs.matrix.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.projects) }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3

      # The build context is the project directory alone. Needing a sibling's file
      # breaks the build, which is the intended feedback (ADR 0002).
      - name: build image
        if: matrix.containerized
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.path }}
          push: false
          load: true
          tags: horizon/${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: scan image
        if: matrix.containerized
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: horizon/${{ matrix.name }}:ci
          format: table
          exit-code: '0'
          severity: HIGH,CRITICAL
