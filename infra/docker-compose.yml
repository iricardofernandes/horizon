# Host ports are overridable through infra/.env (see infra/.env.example). The defaults
# are the conventional ones; a developer whose machine already runs a Postgres on 5432
# changes one line instead of stopping their other work.
#
# The Horizon platform: everything the services run against, and nothing of Horizon
# itself. Modules run from source (npm run dev) or from the docker-compose.apps.yml
# overlay, so the platform can be up while a service is being rewritten.
#
#   make up      start and wait for health
#   make smoke   prove it actually works
#   make down    stop, keeping volumes
#
# The project name is fixed because Alloy filters container logs on the compose project
# label; renaming it silently stops log collection.
name: horizon

x-restart: &restart
  restart: unless-stopped

networks:
  horizon:
    name: horizon
  # Only the web server and Kong (Phase 80). Kong believes `X-Forwarded-For` from one
  # address, the web server's, and no other container or host can hold it.
  edge:
    name: horizon-edge
    ipam:
      config:
        - subnet: ${HORIZON_EDGE_SUBNET:-10.213.80.0/29}

volumes:
  postgres-data:
  # Recovery (ADR 0063, Phase 69): archived WAL, base backups, and the cluster's socket,
  # shared with the backup container so it needs no network access to the cluster.
  postgres-wal:
  postgres-base:
  postgres-socket:
  redis-data:
  rabbitmq-data:
  verdaccio-storage:
  prometheus-data:
  loki-data:
  grafana-data:
  mcp-debugger-audit:
  fiscal-artifacts:
  clamav-signatures:

services:
  # Object storage for Fiscal's artifacts, reporting's exports (Phase 63) and the files
  # module's attachments (Phase 65); part of the default platform.
  minio:
    <<: *restart
    # MinIO stopped publishing public images; a pinned community build from source.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    container_name: horizon-minio
    networks: [horizon]
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${HORIZON_MINIO_USER:-horizon-fiscal-local}
      MINIO_ROOT_PASSWORD: ${HORIZON_MINIO_PASSWORD:-horizon-fiscal-local-secret}
    volumes:
      - fiscal-artifacts:/data

  minio-init:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z@sha256:cfc83108c3abb371f8fb84d99c1fdc88f8c237e022409b0081fb7c0a3be634dd
    networks: [horizon]
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: ${HORIZON_MINIO_USER:-horizon-fiscal-local}
      MINIO_ROOT_PASSWORD: ${HORIZON_MINIO_PASSWORD:-horizon-fiscal-local-secret}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do sleep 2; done
        mc mb --ignore-existing local/horizon-fiscal-artifacts
        mc version enable local/horizon-fiscal-artifacts
        mc mb --ignore-existing local/horizon-exports
        mc version enable local/horizon-exports
        mc mb --ignore-existing local/horizon-attachments
        # Every bucket is versioned, so a restore can go back to a point in time (ADR 0063).
        # A removed attachment's old version is kept 30 days, as ciphertext whose owner key
        # erasure has already destroyed (Phase 65); exports are regenerable, 7 days.
        mc version enable local/horizon-attachments
        mc ilm rule add --noncurrent-expire-days 30 local/horizon-attachments || true
        mc ilm rule add --noncurrent-expire-days 7 local/horizon-exports || true

  # ClamAV for the files module's scanner port (ADR 0060), opt-in with `make up-scanner`.
  # It downloads its signatures at start, which is large and often refused from CI
  # runners, so the default stack and CI use the deterministic EICAR adapter instead.
  clamav:
    <<: *restart
    profiles: [scanner]
    image: clamav/clamav:1.4@sha256:57deb108fc4c72778aa83eafbca7bb7153e28c3f57c005afd38d31f16da86f23
    container_name: horizon-clamav
    networks: [horizon]
    ports: ['${HORIZON_CLAMD_PORT:-3310}:3310']
    volumes:
      - clamav-signatures:/var/lib/clamav
    healthcheck:
      test: ['CMD', 'clamdcheck.sh']
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 300s

  # Mailpit catches Identity's invitation mail (Phase 67): SMTP on 1025, the inbox on 8025.
  mailpit:
    <<: *restart
    image: axllent/mailpit:v1.27@sha256:e22dce5b36f93c77082e204a3942fb6b283b7896e057458400a4c88344c3df68
    container_name: horizon-mailpit
    networks: [horizon]
    ports:
      - '${HORIZON_MAILPIT_SMTP_PORT:-1025}:1025'
      - '${HORIZON_MAILPIT_UI_PORT:-8025}:8025'

  # ---------------------------------------------------------------- data
  postgres:
    <<: *restart
    # postgres:17-alpine plus pgvector (ADR 0067, Phase 74); see infra/postgres/image.
    image: horizon/postgres:17-pgvector-0.8.1
    build:
      context: ./postgres/image
    container_name: horizon-postgres
    networks: [horizon]
    ports: ['${HORIZON_POSTGRES_PORT:-5432}:5432']
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      # Roles created by the init script. Local development values only.
      HORIZON_OWNER_PASSWORD: horizon
      HORIZON_APP_PASSWORD: horizon
      HORIZON_RELAY_PASSWORD: horizon
      HORIZON_DEBUG_PASSWORD: horizon
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      # Every query is bounded (ADR 0027). A statement that runs longer than this in
      # local development is a bug worth seeing rather than waiting through.
      - -c
      - statement_timeout=30s
      # Twelve services, each with a pool of ten plus a relay, the Fiscal worker and the
      # one-off scripts: the default of 100 runs out once CRM joins (Phase 55).
      - -c
      - max_connections=200
      # Point-in-time recovery (ADR 0063): every WAL segment is copied to the archive, never
      # overwritten, and one is closed at least every 5 minutes, so at most 5 minutes of
      # committed work can be lost against an RPO of 15.
      - -c
      - archive_mode=on
      - -c
      - archive_command=test ! -f /backups/wal/%f && cp %p /backups/wal/%f
      - -c
      - archive_timeout=300
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - postgres-wal:/backups/wal
      - postgres-socket:/var/run/postgresql
    depends_on:
      postgres-volumes:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d postgres']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # The backup volumes belong to the postgres user (uid 70) before the cluster writes to them.
  postgres-volumes:
    image: postgres:17-alpine
    networks: [horizon]
    user: root
    entrypoint: ['/bin/sh', '-ec']
    command: ['mkdir -p /backups/wal /backups/base && chown -R 70:70 /backups /var/run/postgresql']
    volumes:
      - postgres-wal:/backups/wal
      - postgres-base:/backups/base
      - postgres-socket:/var/run/postgresql

  # Scheduled base backups through the cluster's local socket (ADR 0063, Phase 69).
  postgres-backup:
    <<: *restart
    image: horizon/postgres:17-pgvector-0.8.1
    container_name: horizon-postgres-backup
    networks: [horizon]
    user: '70:70'
    entrypoint: ['/bin/sh', '/scripts/basebackup.sh']
    environment:
      BASEBACKUP_INTERVAL_SECONDS: ${HORIZON_BASEBACKUP_INTERVAL_SECONDS:-21600}
      BASEBACKUP_KEEP: ${HORIZON_BASEBACKUP_KEEP:-7}
    volumes:
      - ./postgres/backup:/scripts:ro
      - postgres-wal:/backups/wal
      - postgres-base:/backups/base
      - postgres-socket:/var/run/postgresql
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    <<: *restart
    image: redis:7-alpine
    container_name: horizon-redis
    networks: [horizon]
    ports: ['${HORIZON_REDIS_PORT:-6379}:6379']
    command: ['redis-server', '--appendonly', 'yes', '--save', '60', '1']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    <<: *restart
    image: rabbitmq:4-management-alpine
    container_name: horizon-rabbitmq
    # RabbitMQ keeps its state under its node name, `rabbit@<hostname>`: a fixed hostname is
    # what lets a recreated broker find its queues and dead letters again.
    hostname: rabbitmq
    networks: [horizon]
    ports:
      - '${HORIZON_RABBITMQ_PORT:-5672}:5672'
      - '${HORIZON_RABBITMQ_UI_PORT:-15672}:15672'
    # The users are not RabbitMQ's defaults: one per module, each publishing only its own
    # events (Phase 90). `make broker-config` renders them before the broker starts.
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./rabbitmq/90-horizon.conf:/etc/rabbitmq/conf.d/90-horizon.conf:ro
      - ./generated/rabbitmq-definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'check_running']
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  # ---------------------------------------------------------------- registry
  verdaccio:
    <<: *restart
    image: verdaccio/verdaccio:6
    container_name: horizon-verdaccio
    networks: [horizon]
    ports: ['${HORIZON_VERDACCIO_PORT:-4873}:4873']
    volumes:
      - verdaccio-storage:/verdaccio/storage
      - ./verdaccio/config.yaml:/verdaccio/conf/config.yaml:ro
    healthcheck:
      # 127.0.0.1, not localhost: inside this image localhost resolves to ::1 first and
      # Verdaccio binds IPv4 only, so the check fails while the service is fine. Every
      # healthcheck here uses the literal address for the same reason.
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:4873/-/ping']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  # ---------------------------------------------------------------- observability
  # Distroless: no shell, no health subcommand, so no container healthcheck is
  # expressible. Readiness is asserted from the host by infra/scripts/smoke.sh.
  otel-collector:
    <<: *restart
    image: otel/opentelemetry-collector-contrib:0.140.0
    container_name: horizon-otel-collector
    networks: [horizon]
    command: ['--config=/etc/otel/config.yaml']
    ports:
      - '${HORIZON_OTLP_GRPC_PORT:-4317}:4317'
      - '${HORIZON_OTLP_HTTP_PORT:-4318}:4318'
      - '${HORIZON_COLLECTOR_METRICS_PORT:-8889}:8889'
      - '${HORIZON_COLLECTOR_HEALTH_PORT:-13133}:13133'
    volumes:
      - ./observability/otel-collector.yaml:/etc/otel/config.yaml:ro
    depends_on:
      jaeger:
        condition: service_healthy
      loki:
        condition: service_healthy

  jaeger:
    <<: *restart
    image: jaegertracing/jaeger:2.11.0
    container_name: horizon-jaeger
    networks: [horizon]
    ports:
      - '${HORIZON_JAEGER_PORT:-16686}:16686'
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:16686/']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  prometheus:
    <<: *restart
    image: prom/prometheus:v3.7.3
    container_name: horizon-prometheus
    networks: [horizon]
    ports: ['${HORIZON_PROMETHEUS_PORT:-9090}:9090']
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:9090/-/healthy']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  loki:
    <<: *restart
    image: grafana/loki:3.5.7
    container_name: horizon-loki
    networks: [horizon]
    ports: ['${HORIZON_LOKI_PORT:-3100}:3100']
    command: ['-config.file=/etc/loki/config.yaml']
    volumes:
      - ./observability/loki.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    healthcheck:
      test: ['CMD', '/busybox/wget', '--spider', '-q', 'http://127.0.0.1:3100/ready']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  # Distroless, as with the Collector: asserted from the host in smoke.sh.
  alloy:
    <<: *restart
    image: grafana/alloy:v1.12.1
    container_name: horizon-alloy
    networks: [horizon]
    ports: ['${HORIZON_ALLOY_PORT:-12345}:12345']
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./observability/alloy.alloy:/etc/alloy/config.alloy:ro
      # Read-only access to the socket: Alloy discovers containers and reads their logs.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      loki:
        condition: service_healthy

  grafana:
    <<: *restart
    image: grafana/grafana:12.4.0
    container_name: horizon-grafana
    networks: [horizon]
    # 3000-3005 belong to web/ and the five services, so Grafana moves out of the way.
    ports: ['${HORIZON_GRAFANA_PORT:-3300}:3000']
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: dark
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_FEATURE_TOGGLES_ENABLE: traceToProfiles
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      jaeger:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:3000/api/health']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s

  # Opt-in operator tool: `docker compose --profile debugger up -d mcp-debugger`.
  # It is absent from the default runtime and binds only to the host loopback address.
  mcp-debugger:
    <<: *restart
    profiles: [debugger]
    build:
      context: ../tooling/mcp-debugger
    container_name: horizon-mcp-debugger
    networks: [horizon]
    ports: ['127.0.0.1:${HORIZON_MCP_DEBUGGER_PORT:-7801}:7801']
    environment:
      HORIZON_MCP_DEBUGGER_ENABLED: 'true'
      MCP_TRANSPORT: http
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT: 7801
      MCP_ALLOWED_HOSTS: 127.0.0.1,localhost,horizon-mcp-debugger
      MCP_BEARER_TOKEN: '${HORIZON_MCP_BEARER_TOKEN:-horizon-local-debugger-token-change-me}'
      LOKI_URL: http://loki:3100
      JAEGER_URL: http://jaeger:16686
      PROMETHEUS_URL: http://prometheus:9090
      RABBITMQ_MANAGEMENT_URL: http://rabbitmq:15672
      # A monitoring user: it lists queues and holds no right on any of them (Phase 90).
      RABBITMQ_MANAGEMENT_USER: mcp-debugger
      RABBITMQ_MANAGEMENT_PASSWORD: ${HORIZON_RABBITMQ_PASSWORD_MCP_DEBUGGER:-mcp-debugger-local}
      DEBUG_DATABASE_URLS: identity=postgres://horizon_debug:${HORIZON_DEBUG_PASSWORD:-horizon}@postgres:5432/horizon_identity,catalog=postgres://horizon_debug:${HORIZON_DEBUG_PASSWORD:-horizon}@postgres:5432/horizon_catalog,inventory=postgres://horizon_debug:${HORIZON_DEBUG_PASSWORD:-horizon}@postgres:5432/horizon_inventory,sales=postgres://horizon_debug:${HORIZON_DEBUG_PASSWORD:-horizon}@postgres:5432/horizon_sales,webhooks=postgres://horizon_debug:${HORIZON_DEBUG_PASSWORD:-horizon}@postgres:5432/horizon_webhooks
      TENANT_ID_HASH_SALT: '${HORIZON_TENANT_HASH_SALT:-horizon-local-tenant-hash-salt}'
      PII_MASK_FIELDS: email,cpf,cnpj,phone,address,name,ip
      MAX_RESULT_ROWS: 500
      MAX_RESULT_BYTES: 262144
      RATE_LIMIT_PER_TOOL_PER_MINUTE: 30
      AUDIT_LOG_PATH: /var/log/horizon/mcp-debugger-audit.log
    volumes:
      - mcp-debugger-audit:/var/log/horizon
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      jaeger:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:7801/mcp').then(r=>process.exit(r.status===401?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  # ---------------------------------------------------------------- gateway
  kong:
    <<: *restart
    image: kong:3.9
    container_name: horizon-kong
    networks:
      horizon: {}
      # Fixed, like the web server's, so neither can take the other's address.
      edge:
        ipv4_address: ${HORIZON_KONG_EDGE_ADDRESS:-10.213.80.5}
    ports:
      - '${HORIZON_KONG_PROXY_PORT:-8000}:8000'
      - '${HORIZON_KONG_ADMIN_PORT:-8001}:8001'
    environment:
      KONG_DATABASE: 'off'
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_ADMIN_GUI_LISTEN: 'off'
      KONG_LOG_LEVEL: notice
      KONG_TRACING_INSTRUMENTATIONS: all
      KONG_TRACING_SAMPLING_RATE: '1.0'
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_PLUGINS: bundled
      # Every browser reaches Kong through the web server, which names the browser's address
      # (web/trusted-address.cjs); limits per address then count each browser (Phase 80).
      # Any other caller is limited by its own connection's address.
      KONG_TRUSTED_IPS: ${HORIZON_WEB_EDGE_ADDRESS:-10.213.80.6}
      KONG_REAL_IP_HEADER: X-Forwarded-For
      KONG_REAL_IP_RECURSIVE: 'off'
      # Upstreams are resolved per request, so the gateway starts before the services
      # exist and answers 503 for them until they do.
      KONG_DNS_RESOLVER: 127.0.0.11
      # Docker answers with a 600 s TTL, so a recreated service stayed unreachable through
      # Kong (502) for minutes at its old address (Phase 81). Five seconds bounds that.
      KONG_DNS_VALID_TTL: '5'
      KONG_RESOLVER_VALID_TTL: '5'
    volumes:
      # The rendered file, not gateway/kong.yml: Kong OSS has no JWKS plugin, so the
      # public keys are injected by infra/scripts/render-kong-config.sh. See that script
      # and the note at the top of gateway/kong.yml.
      - ./generated/kong.generated.yml:/kong/kong.yml:ro
    depends_on:
      otel-collector:
        condition: service_started
    healthcheck:
      test: ['CMD', 'kong', 'health']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
