global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: local

scrape_configs:
  # Application metrics arrive through the Collector, which re-exposes them here.
  # Services are never scraped directly (ADR 0033).
  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8889']

  - job_name: otel-collector-internal
    static_configs:
      - targets: ['otel-collector:8888']

  - job_name: kong
    static_configs:
      - targets: ['kong:8001']
    metrics_path: /metrics

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
