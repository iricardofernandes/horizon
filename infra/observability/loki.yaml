# Single-binary Loki for local development. Loki indexes labels rather than content,
# which is what keeps the whole observability plane runnable on a laptop (ADR 0033).

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  metric_aggregation_enabled: true
  allow_structured_metadata: true
  volume_enabled: true
  reject_old_samples: false

# OTLP logs arrive from the Collector. traceId and spanId are promoted to structured
# metadata so a log line can be found from a trace and the reverse (ADR 0033).
distributor:
  otlp_config:
    default_resource_attributes_as_index_labels:
      - service.name
      - deployment.environment

ruler:
  alertmanager_url: http://localhost:9093

analytics:
  reporting_enabled: false
