_format_version: '3.0'
_transform: true

# Kong in DB-less mode (ADR 0008). This file is the only source of gateway
# configuration: behaviour changes arrive as reviewable diffs and a rollback is a git
# revert. There is no Admin API path that can change it at runtime.
#
# NOTE ON JWT VALIDATION. Kong OSS verifies EdDSA (RFC 8037) in its `jwt` plugin, but it
# has no plugin that fetches a JWKS document — `openid-connect` is Enterprise-only. The
# public key therefore has to be present in the declarative configuration, and this file
# is a template: `infra/scripts/render-kong-config.sh` injects the current Ed25519
# public keys and writes infra/generated/kong.generated.yml, which is what the container
# actually mounts. Rotation re-renders rather than hand-editing.
#
# This is defence in depth, not the only check: every service re-verifies the token
# itself (TRUST_GATEWAY_JWT=false), so reaching a service's port directly grants nothing.

services:
  - name: identity
    url: http://identity:3001
    retries: 3
    connect_timeout: 5000
    write_timeout: 10000
    read_timeout: 10000
    routes:
      - name: identity-public
        paths:
          - /auth
          - /.well-known
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              minute: 30
              policy: local
              limit_by: ip
              fault_tolerant: true
      # Sign-in has a route of its own, so its availability and latency are an SLI (Phase 70);
      # it keeps the public routes' rate limit.
      - name: identity-login
        paths:
          - /auth/login
        methods: [POST]
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              minute: 30
              policy: local
              limit_by: ip
              fault_tolerant: true
      # Key exchanges have a route of their own (ADR 0064): the agent server exchanges for
      # every tenant from one address, so the ceiling per IP is wide and the real limit is
      # counted per key by Identity.
      - name: identity-key-exchange
        paths:
          - /auth/api-key/token
        methods: [POST]
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              minute: 1200
              policy: local
              limit_by: ip
              fault_tolerant: true
      - name: identity-api
        paths:
          - /identity
        strip_path: true

  - name: catalog
    url: http://catalog:3002
    retries: 3
    connect_timeout: 5000
    write_timeout: 10000
    read_timeout: 10000
    routes:
      - name: catalog-api
        paths:
          - /catalog
        strip_path: true

  - name: inventory
    url: http://inventory:3003
    retries: 3
    connect_timeout: 5000
    write_timeout: 10000
    read_timeout: 10000
    routes:
      - name: inventory-api
        paths:
          - /inventory
        strip_path: true

  - name: sales
    url: http://sales:3004
    retries: 3
    connect_timeout: 5000
    write_timeout: 10000
    read_timeout: 10000
    routes:
      - name: sales-api
        paths:
          - /sales
        strip_path: true

  - name: parties
    url: http://parties:3006
    retries: 3
    connect_timeout: 5000
    write_timeout: 10000
    read_timeout: 10000
    routes:
      - name: parties-api
        paths:
          - /parties
        strip_path: true

  - name: financial
    url: http://financial:3007
    retries: 3
    connect_timeout: 5000
    write_timeout: 10000
    read_timeout: 10000
    routes:
      - name: financial-api
        paths:
          - /financial
        strip_path: true

  - name: treasury
    url: http://treasury:3008
    retries: 3
    connect_timeout: 5000
    write_timeout: 10000
    read_timeout: 10000
    routes:
      - name: treasury-api
        paths:
          - /treasury
        strip_path: true

  - name: ledger
    url: http://ledger:3009
    retries: 3
    connect_timeout: 5000
    write_timeout: 10000
    read_timeout: 10000
    routes:
      - name: ledger-api
        paths:
          - /ledger
        strip_path: true

  - name: procurement
    url: http://procurement:3010
    retries: 3
    connect_timeout: 5000
    write_timeout: 10000
    read_timeout: 10000
    routes:
      - name: procurement-api
        paths:
          - /procurement
        strip_path: true

  - name: crm
    url: http://crm:3012
    retries: 3
    connect_timeout: 5000
    write_timeout: 10000
    read_timeout: 10000
    routes:
      - name: crm-api
        paths:
          - /crm
        strip_path: true

  - name: reporting
    url: http://reporting:3013
    retries: 3
    connect_timeout: 5000
    write_timeout: 10000
    read_timeout: 10000
    routes:
      - name: reporting-api
        paths:
          - /reporting
        strip_path: true

  # Attachments (Phase 65). An upload is the file itself, up to 10 MiB, so this route's
  # body limit is above the global 8 MB one.
  - name: files
    url: http://files:3014
    retries: 3
    connect_timeout: 5000
    write_timeout: 30000
    read_timeout: 30000
    routes:
      - name: files-api
        paths:
          - /files
        strip_path: true
        plugins:
          - name: request-size-limiting
            config:
              allowed_payload_size: 11
              size_unit: megabytes

  # The tenant's MCP endpoint (ADR 0065): /agent/tenants/{tenantId}/mcp. The API key is
  # authenticated by the agent itself, through the exchange; Kong verifies no JWT here.
  - name: agent
    url: http://agent:3015
    retries: 3
    connect_timeout: 5000
    write_timeout: 30000
    read_timeout: 30000
    routes:
      - name: agent-api
        paths:
          - /agent
        strip_path: true

  # The document index (ADR 0067): its status now, search from Phase 75.
  - name: knowledge
    url: http://knowledge:3016
    retries: 3
    connect_timeout: 5000
    write_timeout: 30000
    read_timeout: 30000
    routes:
      - name: knowledge-api
        paths:
          - /knowledge
        strip_path: true

  - name: fiscal
    url: http://fiscal:3011
    retries: 3
    connect_timeout: 5000
    write_timeout: 10000
    read_timeout: 10000
    routes:
      - name: fiscal-api
        paths:
          - /fiscal
        strip_path: true

  - name: webhooks
    url: http://webhooks:3005
    retries: 3
    connect_timeout: 5000
    write_timeout: 10000
    read_timeout: 10000
    routes:
      - name: webhooks-api
        paths:
          - /webhooks
        strip_path: true

  # The gateway's own verification endpoint. It has no upstream: request-termination
  # answers directly, so this proves the gateway validates a token without any service
  # existing behind it. infra/scripts/smoke.sh calls it with a valid token and with one
  # signed by an unknown key, and expects 200 then 401.
  - name: gateway-selftest
    url: http://127.0.0.1:1
    routes:
      - name: gateway-verify
        paths:
          - /gateway/verify
        strip_path: true
        plugins:
          - name: jwt
            config:
              claims_to_verify:
                - exp
              key_claim_name: iss
              run_on_preflight: false
          - name: request-termination
            config:
              status_code: 200
              content_type: application/json
              body: '{"gateway":"ok","token":"verified"}'

# Consumers carry the Ed25519 public keys and are injected by
# infra/scripts/render-kong-config.sh, because Kong OSS has no plugin that fetches a
# JWKS document. The committed file deliberately declares none, so it is valid on its
# own and `deck file validate` checks it in CI.

plugins:
  # Every response carries a correlation id, and it is the same value the services log
  # and the Collector traces (ADR 0033).
  - name: correlation-id
    config:
      header_name: X-Request-Id
      generator: uuid
      echo_downstream: true

  # Reject oversized bodies at the edge rather than in five services.
  - name: request-size-limiting
    config:
      allowed_payload_size: 8
      size_unit: megabytes

  - name: cors
    config:
      origins:
        - http://localhost:3000
      methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
      headers:
        - Accept
        - Authorization
        - Content-Type
        - Idempotency-Key
        - X-Request-Id
      exposed_headers:
        - X-Request-Id
      credentials: true
      max_age: 3600

  # A global ceiling, per address. Per-consumer and per-API-key tiers are attached to
  # consumers. Since Phase 80 the address is each browser's: one person working quickly
  # reached 600 a minute (a screen reads a dozen resources at once), so it is 1200.
  - name: rate-limiting
    config:
      minute: 1200
      policy: local
      limit_by: ip
      fault_tolerant: true

  # Gateway spans join the same trace as the services behind it, so a flow is one trace
  # from the edge inwards (ADR 0033).
  - name: opentelemetry
    config:
      traces_endpoint: http://otel-collector:4318/v1/traces
      resource_attributes:
        service.name: gateway
      propagation:
        extract: [w3c]
        inject: [preserve]
        default_format: w3c

  - name: prometheus
    config:
      status_code_metrics: true
      latency_metrics: true
      per_consumer: false
